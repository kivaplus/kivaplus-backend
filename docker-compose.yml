version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kivaplus-postgres
    environment:
      POSTGRES_DB: kivaplus_local
      POSTGRES_USER: kivaplus
      POSTGRES_PASSWORD: kivaplus123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - kivaplus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kivaplus -d kivaplus_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kivaplus-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass kivaplus123
    volumes:
      - redis_data:/data
    networks:
      - kivaplus-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LocalStack - AWS services emulation
  localstack:
    image: localstack/localstack:3.0
    container_name: kivaplus-localstack
    ports:
      - "4566:4566" # LocalStack Gateway
      - "4510-4559:4510-4559" # External services port range
    environment:
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LOCALSTACK_HOST=localstack
      - EDGE_PORT=4566
      - SERVICES=lambda,apigateway,apigatewayv2,s3,secretsmanager,ssm,iam,sts,logs
      - LAMBDA_EXECUTOR=docker
      - LAMBDA_REMOTE_DOCKER=false
      - LAMBDA_DOCKER_NETWORK=kivaplus_kivaplus-network
      - PERSISTENCE=0
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SKIP_INFRA_DOWNLOADS=1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./dist:/opt/code/localstack/dist"
    networks:
      - kivaplus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - localstack

  # Build service for creating Lambda deployment packages
  lambda-builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    container_name: kivaplus-lambda-builder
    volumes:
      - .:/workspace
      - ./dist:/workspace/dist
    working_dir: /workspace
    networks:
      - kivaplus-network
    profiles:
      - build

  # Integration tests service
  integration-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: kivaplus-integration-tests
    environment:
      # Database configuration
      DATABASE_URL: postgres://kivaplus:kivaplus123@postgres:5432/kivaplus_local?sslmode=disable

      # Redis configuration
      REDIS_URL: redis://:kivaplus123@redis:6379

      # JWT configuration
      JWT_SECRET: integration-test-secret-key

      # AWS/LocalStack configuration
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      LOCALSTACK_ENDPOINT: http://localstack:4566
      USE_LOCALSTACK: "true"

      # API Gateway configuration (will be set by setup script)
      API_GATEWAY_URL: http://localstack:4566/restapis/test-api/local/_user_request_

      # Test configuration
      TEST_TIMEOUT: 30s
      LOG_LEVEL: debug
    volumes:
      - .:/workspace
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kivaplus-network
    profiles:
      - test

  # LocalStack setup service
  localstack-setup:
    build:
      context: .
      dockerfile: Dockerfile.setup
    container_name: kivaplus-localstack-setup
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      LOCALSTACK_ENDPOINT: http://localstack:4566
    volumes:
      - ./dist:/opt/code/dist
      - ./scripts:/opt/scripts
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - kivaplus-network
    profiles:
      - setup

  # Go Application (for local development)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kivaplus-app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://kivaplus:kivaplus123@postgres:5432/kivaplus_local?sslmode=disable
      - JWT_SECRET=local-development-secret-key-not-for-production
      - LOG_LEVEL=debug
      - REDIS_URL=redis://:kivaplus123@redis:6379
    volumes:
      - .:/app
      - go_modules:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kivaplus-network
    profiles:
      - app
    restart: unless-stopped
    command: ["go", "run", "cmd/local-server/main.go"]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  go_modules:
    driver: local

networks:
  kivaplus-network:
    driver: bridge
